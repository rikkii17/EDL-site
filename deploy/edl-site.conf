# Deploy only public/ as DocumentRoot. Replace the certificate paths after issuance.
<VirtualHost *:80>
    ServerName edl-site.ricky17.com
    Redirect permanent / https://edl-site.ricky17.com/
</VirtualHost>
<VirtualHost *:443>
    ServerName edl-site.ricky17.com
    DocumentRoot /opt/edl/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/edl-site.ricky17.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/edl-site.ricky17.com/privkey.pem
    SetEnv EDL_DATA_DIR /var/lib/edl
    <Directory /opt/edl/public>
        Require all granted
        AllowOverride None
        Options -Indexes -Includes -ExecCGI
    </Directory>
    <Directory /opt/edl/private>
        Require all denied
    </Directory>
    <Directory /opt/edl/bin>
        Require all denied
    </Directory>
    LimitRequestBody 2048
    Timeout 15
    KeepAliveTimeout 2
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Header always set Strict-Transport-Security "max-age=31536000"
    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <IfModule evasive20_module>
        DOSHashTableSize 3097
        DOSPageCount 10
        DOSSiteCount 60
        DOSPageInterval 1
        DOSSiteInterval 1
        DOSBlockingPeriod 30
    </IfModule>
    ErrorLog ${APACHE_LOG_DIR}/edl-error.log
    CustomLog ${APACHE_LOG_DIR}/edl-access.log combined
</VirtualHost>
